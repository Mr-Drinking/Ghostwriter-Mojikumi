id: io.github.mr_drinking.ghostwriter-mojikumi
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
command: ghostwriter
rename-icon: ghostwriter
# This repository publishes a standalone .flatpak bundle rather than a
# repository plus a separately downloaded .Locale extension. Keep every
# interface translation inside that single distributable bundle.
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=QTWEBENGINE_DICTIONARIES_PATH=/app/qtwebengine_dictionaries

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: ghostwriter-mojikumi
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      # This manifest is intended for repository CI and local builds of the
      # current checkout. A future Flathub submission must replace this with
      # an immutable release archive and checksum.
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak
          - .flatpak-builder
          - build*
          - _build
