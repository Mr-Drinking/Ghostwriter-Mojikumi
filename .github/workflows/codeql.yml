name: CodeQL

on:
  push:
    branches:
      - main
      - master
      - mojikumi-26.08
  pull_request:
  schedule:
    - cron: "34 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@df559355d593f76b3f2e14730572699cc5db7a48 # v3
        with:
          languages: c-cpp
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@df559355d593f76b3f2e14730572699cc5db7a48 # v3
