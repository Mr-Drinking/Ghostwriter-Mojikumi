name: Build packages

on:
  push:
    branches:
      - main
      - master
      - mojikumi-26.08
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: craft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # These are native desktop builds. Hosted runners export Android paths that
  # can make Craft select Android-specific defaults in later workflow steps.
  ANDROID_HOME: ""
  ANDROID_NDK_HOME: ""
  ANDROID_SDK_ROOT: ""
  CRAFT_REVISION: d12d8aa71729806c06902afc3426a22b3bea5088
  CRAFT_KF_VERSION: 6.28.0
  CRAFT_PACKAGE: ghostwriter-mojikumi/ghostwriter-mojikumi
  CRAFT_QT_VERSION: 6.11.1
  MOJIKUMI_VERSION: 26.08.0
  PYTHONUTF8: "1"

jobs:
  package:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            artifact: ghostwriter-mojikumi-windows-x86_64-portable
            expected_abi: windows-cl-msvc2022-x86_64
            package_type: PortablePackager
            archive_type: zip
          - runner: macos-15-intel
            artifact: ghostwriter-mojikumi-macos-x86_64-dmg
            expected_abi: macos-clang-x86_64
            package_type: MacDMGPackager
            archive_type: ""
          - runner: macos-15
            artifact: ghostwriter-mojikumi-macos-arm64-dmg
            expected_abi: macos-clang-arm64
            package_type: MacDMGPackager
            archive_type: ""
          - runner: ubuntu-24.04
            artifact: ghostwriter-mojikumi-linux-x86_64-appimage
            expected_abi: linux-gcc-x86_64
            package_type: AppImagePackager
            archive_type: ""

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install Linux host prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream \
            build-essential \
            bison \
            flex \
            fuse3 \
            gperf \
            libatspi2.0-dev \
            libcap-dev \
            libcups2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfuse2t64 \
            libgl-dev \
            libglib2.0-dev \
            libnss3-dev \
            libpulse-dev \
            libssl-dev \
            libudev-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-res0 \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-util-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrender-dev \
            ninja-build \
            patchelf \
            pkg-config \
            python3-pip

      - name: Bootstrap KDE Craft on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Craft also uses ANDROID_SDK_ROOT to select Android's MinSizeRel
          # cache, even after it has selected a native Windows ABI.
          Remove-Item Env:ANDROID_HOME -ErrorAction SilentlyContinue
          Remove-Item Env:ANDROID_SDK_ROOT -ErrorAction SilentlyContinue
          Remove-Item Env:ANDROID_NDK_HOME -ErrorAction SilentlyContinue
          Invoke-WebRequest `
            -Uri "https://invent.kde.org/packaging/craft/-/raw/${env:CRAFT_REVISION}/setup/CraftBootstrap.py" `
            -OutFile "CraftBootstrap.py"
          python CraftBootstrap.py `
            --prefix "${{ runner.temp }}/CraftRoot" `
            --branch "${env:CRAFT_REVISION}" `
            --use-defaults

      - name: Bootstrap KDE Craft on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # GitHub's macOS and Linux images export Android SDK variables.
          # Craft otherwise mistakes the host for an Android cross-build.
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve

          urlretrieve(
              "https://invent.kde.org/packaging/craft/-/raw/"
              "d12d8aa71729806c06902afc3426a22b3bea5088/"
              "setup/CraftBootstrap.py",
              Path("CraftBootstrap.py"),
          )
          PY
          python CraftBootstrap.py \
            --prefix "${{ runner.temp }}/CraftRoot" \
            --branch "${CRAFT_REVISION}" \
            --use-defaults

      - name: Configure Craft for the checked-out source
        shell: bash
        run: |
          export MSYS2_ARG_CONV_EXCL="*"
          python packaging/craft/configure_craft.py \
            --settings "${{ runner.temp }}/CraftRoot/etc/CraftSettings.ini" \
            --expected-abi "${{ matrix.expected_abi }}" \
            --blueprints "${{ github.workspace }}/packaging/craft/blueprints" \
            --destination "${{ github.workspace }}/artifacts" \
            --package-type "${{ matrix.package_type }}" \
            --archive-type "${{ matrix.archive_type }}"

      - name: Build checked-out source with Qt 6.11 and KF6
        shell: bash
        run: |
          export MSYS2_ARG_CONV_EXCL="*"
          python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"
          python "${{ runner.temp }}/CraftRoot/craft/bin/craft.py" \
            --ci-mode \
            --output-on-failure \
            --buildtype RelWithDebInfo \
            --options "libs/qt6.version=${CRAFT_QT_VERSION}" \
            --options "kde/frameworks.version=${CRAFT_KF_VERSION}" \
            --options "${CRAFT_PACKAGE}.srcDir=${{ github.workspace }}" \
            "${CRAFT_PACKAGE}"

      - name: Run all Linux tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export MSYS2_ARG_CONV_EXCL="*"
          export QT_QPA_PLATFORM=offscreen
          python "${{ runner.temp }}/CraftRoot/craft/bin/craft.py" \
            --ci-mode \
            --output-on-failure \
            --buildtype RelWithDebInfo \
            --options "libs/qt6.version=${CRAFT_QT_VERSION}" \
            --options "kde/frameworks.version=${CRAFT_KF_VERSION}" \
            --options "${CRAFT_PACKAGE}.srcDir=${{ github.workspace }}" \
            --test \
            "${CRAFT_PACKAGE}"

      - name: Create package
        shell: bash
        run: |
          export MSYS2_ARG_CONV_EXCL="*"
          python "${{ runner.temp }}/CraftRoot/craft/bin/craft.py" \
            --ci-mode \
            --output-on-failure \
            --buildtype RelWithDebInfo \
            --options "libs/qt6.version=${CRAFT_QT_VERSION}" \
            --options "kde/frameworks.version=${CRAFT_KF_VERSION}" \
            --options "${CRAFT_PACKAGE}.srcDir=${{ github.workspace }}" \
            --package \
            "${CRAFT_PACKAGE}"

      - name: Smoke-test Windows portable package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archives = @(
            Get-ChildItem -LiteralPath "artifacts" -Recurse -File |
              Where-Object { $_.Extension -ieq ".zip" }
          )
          if ($archives.Count -ne 1) {
            throw "Expected exactly one portable ZIP, found $($archives.Count)"
          }

          $packageRoot = Join-Path "${{ runner.temp }}" "ghostwriter-package-smoke"
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $packageRoot
          python packaging/craft/verify_package.py `
            windows `
            $packageRoot `
            "${env:MOJIKUMI_VERSION}"

      - name: Create Windows installer from the same build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:ANDROID_HOME -ErrorAction SilentlyContinue
          Remove-Item Env:ANDROID_SDK_ROOT -ErrorAction SilentlyContinue
          Remove-Item Env:ANDROID_NDK_HOME -ErrorAction SilentlyContinue

          # The NSIS executable is a Craft packaging tool. Installing it here
          # reuses the already-built application and dependency images.
          python "${{ runner.temp }}/CraftRoot/craft/bin/craft.py" `
            --ci-mode `
            --output-on-failure `
            dev-utils/nsis
          python packaging/craft/configure_craft.py `
            --settings "${{ runner.temp }}/CraftRoot/etc/CraftSettings.ini" `
            --expected-abi "${{ matrix.expected_abi }}" `
            --blueprints "${{ github.workspace }}/packaging/craft/blueprints" `
            --destination "${{ github.workspace }}/artifacts" `
            --package-type NullsoftInstallerPackager
          python "${{ runner.temp }}/CraftRoot/craft/bin/craft.py" `
            --ci-mode `
            --output-on-failure `
            --buildtype RelWithDebInfo `
            --options "libs/qt6.version=${env:CRAFT_QT_VERSION}" `
            --options "kde/frameworks.version=${env:CRAFT_KF_VERSION}" `
            --options "${env:CRAFT_PACKAGE}.srcDir=${{ github.workspace }}" `
            --package `
            "${env:CRAFT_PACKAGE}"

      - name: Smoke-test Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(
            Get-ChildItem -LiteralPath "artifacts" -Recurse -File |
              Where-Object { $_.Extension -ieq ".exe" }
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one setup EXE, found $($installers.Count)"
          }

          # Craft's NSIS template enables MultiUser command-line mode. A
          # current-user install avoids elevation on the hosted runner.
          $installer = $installers[0].FullName
          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @("/S", "/CurrentUser") `
            -Wait `
            -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with $($install.ExitCode)"
          }

          # Craft's MultiUser template persists the resolved destination here.
          # Reading it avoids duplicating NSIS's version-dependent choice of
          # the per-user Program Files directory.
          $installKey = "HKCU:\Software\Mr-Drinking\Ghostwriter Mojikumi"
          $installProperties = Get-ItemProperty `
            -LiteralPath $installKey `
            -Name @("Install_Dir", "Install_Mode") `
            -ErrorAction Stop
          if ($installProperties.Install_Mode -ne "CurrentUser") {
            throw "NSIS recorded unexpected install mode: $($installProperties.Install_Mode)"
          }
          $installRoot = $installProperties.Install_Dir
          if ([string]::IsNullOrWhiteSpace($installRoot)) {
            throw "NSIS did not record an Install_Dir in $installKey"
          }

          $installRoot = [System.IO.Path]::GetFullPath($installRoot)
          $localAppDataRoot = [System.IO.Path]::GetFullPath($env:LOCALAPPDATA)
          $relativeInstallRoot = [System.IO.Path]::GetRelativePath(
            $localAppDataRoot,
            $installRoot
          )
          if (
            [System.IO.Path]::IsPathRooted($relativeInstallRoot) -or
            $relativeInstallRoot -eq "." -or
            $relativeInstallRoot -eq ".." -or
            $relativeInstallRoot.StartsWith("..$([System.IO.Path]::DirectorySeparatorChar)")
          ) {
            throw "Current-user installer escaped LOCALAPPDATA: $installRoot"
          }

          python packaging/craft/verify_package.py `
            windows `
            $installRoot `
            "${env:MOJIKUMI_VERSION}"
          if ($LASTEXITCODE -ne 0) {
            throw "Installed-package smoke test exited with $LASTEXITCODE"
          }

          $uninstaller = Join-Path $installRoot "uninstall.exe"
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "Missing NSIS uninstaller: $uninstaller"
          }
          $uninstall = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList @("/S", "/CurrentUser") `
            -Wait `
            -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller exited with $($uninstall.ExitCode)"
          }
          Start-Sleep -Seconds 2
          if (Test-Path -LiteralPath (Join-Path $installRoot "bin/ghostwriter.exe")) {
            throw "Uninstaller left the application executable behind"
          }
          if (Test-Path -LiteralPath $installKey) {
            throw "Uninstaller left its application registry key behind"
          }

      - name: Smoke-test macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DMG_PATH="$(python - <<'PY'
          from pathlib import Path

          images = [
              path.resolve()
              for path in Path("artifacts").rglob("*")
              if path.is_file() and path.suffix.casefold() == ".dmg"
          ]
          if len(images) != 1:
              raise SystemExit(
                  f"Expected exactly one DMG, found {len(images)}: {images}"
              )
          print(images[0])
          PY
          )"
          MOUNT_POINT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach \
            -readonly \
            -nobrowse \
            -mountpoint "$MOUNT_POINT" \
            "$DMG_PATH"
          python packaging/craft/verify_package.py \
            macos \
            "$MOUNT_POINT" \
            "${MOJIKUMI_VERSION}"
          hdiutil detach "$MOUNT_POINT"
          trap - EXIT
          rmdir "$MOUNT_POINT" 2>/dev/null || true

      - name: Smoke-test Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APPIMAGE_PATH="$(python - <<'PY'
          from pathlib import Path

          images = [
              path.resolve()
              for path in Path("artifacts").rglob("*")
              if path.is_file() and path.suffix.casefold() == ".appimage"
          ]
          if len(images) != 1:
              raise SystemExit(
                  f"Expected exactly one AppImage, found {len(images)}: {images}"
              )
          print(images[0])
          PY
          )"
          chmod +x "$APPIMAGE_PATH"
          EXTRACT_ROOT="$(mktemp -d)"
          (
            cd "$EXTRACT_ROOT"
            "$APPIMAGE_PATH" --appimage-extract >/dev/null
          )
          python packaging/craft/verify_package.py \
            linux \
            "$EXTRACT_ROOT/squashfs-root" \
            "${MOJIKUMI_VERSION}"

      - name: List produced files
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("artifacts")
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  print(f"{path} ({path.stat().st_size} bytes)")
          PY

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
